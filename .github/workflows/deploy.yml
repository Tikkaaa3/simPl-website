name: Deploy website

on:
  push:
    branches: [main]
  # The reader's release workflow starts this when a release is published.
  workflow_dispatch:
  # A daily rebuild picks up a new reader release even if that trigger fails.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build the static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          # Reads the reader's public releases without the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish to Cloudflare Workers Static Assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Note when Cloudflare is not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish."
